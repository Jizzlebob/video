name: Build Rust WebAssembly

on:
  pull_request:
    paths:
      - "rust-core/**"
      - "script.js"
      - ".github/workflows/build-rust-wasm.yml"
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - "script.js"
      - ".github/workflows/build-rust-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build optimized WebAssembly package
        run: wasm-pack build rust-core --target web --release --out-dir ../pkg --out-name vj_core
      - name: Commit generated web assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg
          if ! git diff --cached --quiet; then
            git commit -m "Build optimized Rust WebAssembly assets"
            git push
          fi
