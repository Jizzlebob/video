<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VJ Studio Remote</title><link rel="stylesheet" href="./remote.css"></head><body><header><b>VJ STUDIO</b><span>REMOTE CONTROL</span><i id="connection">OFFLINE</i></header><main><section id="pair" class="panel"><h1>Mit VJ Studio verbinden</h1><p>Gib den sechsstelligen Code vom PC ein.</p><form id="joinForm"><input id="pin" inputmode="numeric" maxlength="6" placeholder="000000" required><button>Verbinden</button></form><p id="message" class="hint">PC und iPad müssen im selben WLAN sein.</p></section><section id="controls" hidden><div class="panel"><div class="section-head"><h2>Aktiver Clip</h2><select id="trackSelect"></select></div><div class="buttons"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="show">Sichtbar</button><button id="layerStrobe">Layer Strobe</button></div><div class="grid two"><label>Deck<select id="deck"><option>A</option><option>B</option></select></label><label>Deckkraft<output id="opacityOut"></output><input id="opacity" type="range" min="0" max="1" step=".01"></label><label>Lautstärke<output id="volumeOut"></output><input id="volume" type="range" min="0" max="1" step=".01"></label><label>Breite<output id="widthOut"></output><input id="width" type="range" min=".12" max="1" step=".01"></label><label>Höhe<output id="heightOut"></output><input id="height" type="range" min=".08" max="1" step=".01"></label><label>X Position<output id="xOut"></output><input id="x" type="range" min="0" max="1" step=".01"></label><label>Y Position<output id="yOut"></output><input id="y" type="range" min="0" max="1" step=".01"></label></div></div><div class="panel"><h2>Mix & Effekte</h2><div class="grid two"><label>Crossfade<output id="crossfadeOut"></output><input id="crossfade" type="range" min="0" max="100"></label><label>Strobe Intensität<output id="strobeOut"></output><input id="strobe" type="range" min="0" max=".96" step=".01"></label><label>Strobe Rate<output id="rateOut"></output><input id="rate" type="range" min="1" max="8" step=".5"></label><label>Fisheye<output id="fisheyeOut"></output><input id="fisheye" type="range" min="0" max="1" step=".01"></label><label>Visualizer<select id="visualizer"><option value="bars">Neon Bars</option><option value="wave">Waveform</option><option value="circle">Orbit</option><option value="spectrum">Spectrum</option><option value="off">Aus</option></select></label><label>Filter<select id="filter"><option value="none">Original</option><option value="cinema">Cinema</option><option value="vivid">Neon Pop</option><option value="mono">Monochrom</option><option value="noir">Noir</option><option value="dream">Dream Glow</option><option value="warm">Warm Film</option><option value="cool">Arctic</option><option value="invert">Invert</option></select></label><label>Mic Gain<output id="micGainOut"></output><input id="micGain" type="range" min="1" max="30" step=".5"></label><label>Mic Sensitivity<output id="micSensitivityOut"></output><input id="micSensitivity" type="range" min=".8" max="4" step=".1"></label></div><p class="hint">Mikrofon am PC aktivieren. Hier kannst du die Strobe-Empfindlichkeit einstellen.</p></div><p id="syncStatus" class="hint">Warte auf Verbindung …</p></section></main><script src="./remote.js"></script></body></html>
